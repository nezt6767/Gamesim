name: Update sim data
on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 12 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install nba_api requests
      - name: Weekly full rebuild
        if: github.event.schedule == '0 12 * * 1' || github.event_name == 'workflow_dispatch'
        run: python fetch_data.py
      - name: Daily refresh
        if: github.event.schedule == '0 13 * * *'
        run: python fetch_data.py daily
      - run: |
          git config user.name "sim-bot"; git config user.email "sim-bot@users.noreply.github.com"
          git add data.js today.js && (git commit -m "Update data" && git push) || echo "no changes"
